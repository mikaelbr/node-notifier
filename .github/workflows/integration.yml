name: Integration tests

on:
  push:
  pull_request:

jobs:
  integration:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: npm install -g corepack@latest --force && corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install notification daemon (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnotify-bin dunst xvfb dbus systemd

      - name: Run integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- sh -c 'dunst & sleep 1 && pnpm test:integration'

      - name: Start Notification Center (macOS)
        if: runner.os == 'macOS'
        run: |
          open /System/Library/CoreServices/NotificationCenter.app || true
          sleep 2
          pgrep -fl NotificationCenter || echo "NotificationCenter not running"
          # The first notification after startup is slow and can emit stray output, so warm it up
          ./vendor/mac.noindex/terminal-notifier.app/Contents/MacOS/terminal-notifier -title warmup -message warmup || true

      - name: Run integration tests (macOS, Windows)
        if: runner.os != 'Linux'
        run: pnpm test:integration
