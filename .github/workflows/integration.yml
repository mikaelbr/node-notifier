name: Integration tests

on:
  push:
  pull_request:

jobs:
  integration:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: npm install -g corepack@latest && corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install notification daemon (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnotify-bin dunst xvfb dbus systemd

      - name: Run integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- sh -c 'dunst & sleep 1 && pnpm test:integration'

      - name: Run integration tests (macOS, Windows)
        if: runner.os != 'Linux'
        run: pnpm test:integration
